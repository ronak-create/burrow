    <path d="M10.4 11.4C10.4 7.6 15.6 7.6 15.6 11.4"/>
    <path d="M9.6 12.8 10.9 11h4.2l1.3 1.8Z"/>
    <path d="M10 12.8h6l-.5 8.2h-5Z"/>
    <path d="M9.2 21h7.6v2.2H9.2Z"/>
  </g>
  <g fill="none" stroke="#ede8fb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4.5 4.5C7 6.4 10.6 7.2 13 9"/>
    <path d="M10.4 11.4C10.4 7.6 15.6 7.6 15.6 11.4"/>
