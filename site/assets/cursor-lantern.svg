  <!-- Burrow pointer: a carried lantern. Hotspot is the top of the wire (4,4),
       so the lamp hangs from the pointer the way it hangs in the banner art.
       Every stroke is drawn twice — a dark pass underneath for legibility on
       the violet buttons, the metal pass on top for the dark page. -->
