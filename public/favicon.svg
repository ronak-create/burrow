<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Burrow app icon: a tunnel mouth receding into the ground.
       Built from three nested arches at decreasing lightness so it still reads as
       "depth" at 32px, where fine detail would disappear. -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b6dff"/>
      <stop offset="100%" stop-color="#5b3fd1"/>
    </linearGradient>
    <linearGradient id="depth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1b6b"/>
      <stop offset="100%" stop-color="#120b33"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="114" fill="url(#ground)"/>

  <!-- outer mouth -->
  <path d="M136 396 V268 a120 120 0 0 1 240 0 V396 Z" fill="#ffffff" opacity="0.94"/>
  <!-- middle -->
  <path d="M176 396 V276 a80 80 0 0 1 160 0 V396 Z" fill="#a48cff" opacity="0.85"/>
  <!-- the dark centre: the part you have not dug to yet -->
  <path d="M214 396 V284 a42 42 0 0 1 84 0 V396 Z" fill="url(#depth)"/>
</svg>
