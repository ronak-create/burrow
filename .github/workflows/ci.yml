name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["site/**", "**/*.md"]
  pull_request:
    paths-ignore: ["site/**", "**/*.md"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # No `cargo fmt --check`: the Rust here is hand-formatted wider than
      # rustfmt's defaults and reads better for it, and no set of width
      # heuristics reproduces it exactly. Clippy catches the things that matter.
      - name: clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        working-directory: src-tauri
        run: cargo test
